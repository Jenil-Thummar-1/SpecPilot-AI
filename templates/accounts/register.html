{% extends 'base.html' %}

{% block title %}Create Workspace - SpecPilot AI{% endblock %}

{% block auth_content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center" style="background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-4">
            <div class="glass-panel border-0 text-center p-4 p-md-5">
                <a href="/" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none fs-3 fw-bold text-white" style="font-family: var(--font-family-display); letter-spacing: -0.04em;">
                    <i class="bi bi-airplane-engines-fill text-primary text-gradient"></i>
                    <span>SpecPilot <span class="text-gradient">AI</span></span>
                </a>
                
                <h4 class="text-white mb-2 fw-bold" style="letter-spacing: -0.02em;">Create Workspace</h4>
                <p class="text-secondary small mb-4">Set up a new developer profile and initialize your architect agent.</p>
                
                <form method="POST" class="text-start">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-custom" placeholder="developer" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="developer@specpilot.ai" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Confirm Password</label>
                        <input type="password" name="password_confirm" class="form-control form-control-custom" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 fw-bold">Register Workspace</button>
                </form>
                
                <p class="text-secondary small mb-0 mt-2">Already registered? <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none hover-underline">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
