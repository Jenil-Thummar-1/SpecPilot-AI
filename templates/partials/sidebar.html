<div class="sidebar d-flex flex-column justify-content-between">
    <div>
        <a href="{% url 'dashboard' %}" class="sidebar-logo">
            <i class="bi bi-airplane-engines-fill text-primary"></i>
            <span>SpecPilot AI</span>
        </a>
        
        <nav class="nav flex-column">
            <a href="{% url 'dashboard' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>
            <a href="{% url 'project_list' %}" class="nav-link-custom {% if 'project_list' in request.resolver_match.url_name or 'project_detail' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-folder-fill"></i>
                Projects
            </a>
            <a href="{% url 'project_create' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'project_create' %}active{% endif %}">
                <i class="bi bi-plus-circle-fill"></i>
                New Project
            </a>
        </nav>
        
        <hr class="my-4" style="border-color: var(--card-border);">
        
        <!-- Active Agents sidebar list -->
        <div class="px-2">
            <div class="small fw-bold text-muted text-uppercase mb-3" style="font-size: 0.75rem; letter-spacing: 0.05em;">AI Status Control</div>
            <div class="d-flex flex-column gap-2">
                <div class="d-flex align-items-center justify-content-between glass-card p-2 border-0" style="background: rgba(255,255,255,0.02);">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-cpu text-primary"></i>
                        <span class="small fw-semibold">Architect Agent</span>
                    </div>
                    <span class="status-dot success"></span>
                </div>
                <div class="d-flex align-items-center justify-content-between glass-card p-2 border-0" style="background: rgba(255,255,255,0.02);">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-calendar2-range text-accent"></i>
                        <span class="small fw-semibold">Planner Agent</span>
                    </div>
                    <span class="status-dot idle"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- User Section -->
    <div class="mt-auto">
        <div class="glass-card p-3 border-0 d-flex align-items-center justify-content-between" style="background: rgba(255,255,255,0.025);">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-gradient d-flex align-items-center justify-content-center text-white fw-bold" style="width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--accent));">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <div>
                    <div class="fw-semibold text-truncate" style="max-width: 130px; font-size: 0.9rem;">{{ user.username }}</div>
                    <div class="small text-secondary" style="font-size: 0.75rem;">Developer Workspace</div>
                </div>
            </div>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger border-0 p-1" title="Sign Out">
                <i class="bi bi-box-arrow-right fs-5"></i>
            </a>
        </div>
    </div>
</div>
